# Mount Manager agent configuration
server=https://labfdb2.lab.local:8443
# Pin the server CA (sha256 of the CA PEM as logged on first contact); strongly recommended in production.
#ca_sha256=
interval=300
retry_interval=900
# Run mount/umount through sudo (service account). Set 0 only when running as root.
use_sudo=1
# Where mounts are permitted. Built-in defaults (used when these are unset) are shown; they must stay in step
# with /etc/sudoers.d/mountmgr. "prefixes" allow anything below them; "exact" allows those paths themselves.
#allowed_mount_prefixes=/mnt,/data,/sqpc
#allowed_mount_exact=/sqpc
#allowed_fstypes=nfs,nfs4,wekafs
#mount_timeout=60
