# Mount Manager agent configuration
server=https://labfdb2.lab.local:8443
# Pin the server CA (sha256 of the CA PEM as logged on first contact); strongly recommended in production.
#ca_sha256=
# Only if the server's agent listener (8443) uses a certificate from your own CA: the CA bundle that signed it,
# or the word "system" for the operating system's trust store. The agent trusts this CA IN ADDITION to the built-in
# CA it already holds, so it is safe to roll this out before the server switches certificates. Leave unset when
# the server uses the built-in CA (fetched and pinned with ca_sha256 at first contact).
#server_ca_file=/etc/pki/ca-trust/source/anchors/corp-root.pem
interval=300
retry_interval=900
# Run mount/umount through sudo (service account). Set 0 only when running as root.
use_sudo=1
# Where mounts are permitted. Built-in defaults (used when these are unset) are shown; they must stay in step
# with /etc/sudoers.d/mountmgr. "prefixes" allow anything below them; "exact" allows those paths themselves.
#allowed_mount_prefixes=/mnt,/data,/sqpc
#allowed_mount_exact=/sqpc
#allowed_fstypes=nfs,nfs4,wekafs,fuse.vault-fs
# Seconds a mount command may run before it is abandoned. wekafs has its own, longer limit because the first mount
# on a host compiles the client driver and starts the Weka container.
#mount_timeout=60
#mount_timeout_wekafs=120
